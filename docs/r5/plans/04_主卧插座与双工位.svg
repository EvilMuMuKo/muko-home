336" text-anchor="start">M06 · H350</text><circle cx="219.66101694915247" cy="391.6949152542373" r="5.5" fill="#b55336" stroke="#b55336" stroke-width="2"/><line x1="219.66101694915247" y1="391.6949152542373" x2="273.71101694915245" y2="372.1949152542373" stroke="#b55336" stroke-width="1"/><rect x="229.66101694915247" y="360.6949152542373" width="88.1" height="23" rx="4" fill="#fffdf7" stroke="#b55336" stroke-width=".8"/><text x="234.66" y="376.69" font-size="13" fill="#b55336" text-anchor="start">M07 · H2300</text><circle cx="716.6949152542373" cy="231.77966101694915" r="5.5" fill="#faf7ef" stroke="#b77b35" stroke-width="2"/><line x1="716.6949152542373" y1="231.77966101694915" x2="642.6449152542373" y2="212.27966101694915" stroke="#b77b35" stroke-width="1"/><rect x="598.5949152542373" y="200.77966101694915" width="88.1" height="23" rx="4" fill="#fffdf7" stroke="#b77b35" stroke-width=".8"/><text x="603.59" y="216.78" font-size="13" fill="#b77b35" text-anchor="start">A02 · H2300</text><text x="1010.00" y="180.00" font-size="21" fill="#34443a" text-anchor="start">图例与点位约定</text><text x="1010.00" y="218.00" font-size="14" fill="#34443a" text-anchor="start">实心棕点：拟布置电源组</text><text x="1010.00" y="248.00" font-size="14" fill="#34443a" text-anchor="start">空心点：条件未定，暂缓施工</text><text x="1010.00" y="278.00" font-size="14" fill="#34443a" text-anchor="start">蓝点：独立弱电；紫点：固定接线</text><text x="1010.00" y="308.00" font-size="14" fill="#34443a" text-anchor="start">C04：家具排插，不重复算墙插</text><text x="1010.00" y="338.00" font-size="14" fill="#34443a" text-anchor="start">F01菱形：可选地插，非基础方案</text><text x="1010.00" y="368.00" font-size="14" fill="#34443a" text-anchor="start">虚线：尾线示意，须固定收线</text><text x="1010.00" y="398.00" font-size="14" fill="#34443a" text-anchor="start">H：完成地面至面板中心（mm）</text><text x="1010.00" y="428.00" font-size="14" fill="#34443a" text-anchor="start">编号详见下方完整点位表</text><text x="1010.00" y="500.00" font-size="21" fill="#34443a" text-anchor="start">重点位置</text><text x="1010.00" y="540.00" font-size="15" fill="#34443a" text-anchor="start">M01/M02  床架两侧，不在床头板后</text><text x="1010.00" y="573.00" font-size="15" fill="#34443a" text-anchor="start">M03  Windows端，理线槽下方</text><text x="1010.00" y="606.00" font-size="15" fill="#34443a" text-anchor="start">M04  Mac端，理线槽下方</text><text x="1010.00" y="639.00" font-size="15" fill="#34443a" text-anchor="start">M05  洞洞板下、两屏之间常插位</text><text x="1010.00" y="672.00" font-size="15" fill="#34443a" text-anchor="start">M06  窗洞端部实墙，无飘窗开孔</text><text x="1010.00" y="705.00" font-size="15" fill="#34443a" text-anchor="start">M07  衣柜驱动独立可开启服务格</text><text x="1010.00" y="738.00" font-size="15" fill="#34443a" text-anchor="start">主卧门内开扇区不放常用插座</text><text x="1010.00" y="771.00" font-size="15" fill="#34443a" text-anchor="start">空调机身和风口未选，A02待核</text><text x="55.00" y="1020.00" font-size="15" fill="#737b70" text-anchor="start">定位规则：以完成面和固定建筑参照复尺；编号圆点为使用侧位置，柜内墙源及可达面在JSON中分别记录。</text><text x="55.00" y="1055.00" font-size="15" fill="#737b70" text-anchor="start">橙色虚线为概念收线路径，不是电气敷设图。移动电视换位置前断电收线；仅标出的完整状态参与本轮计算。</text><text x="55.00" y="1090.00" font-size="15" fill="#737b70" text-anchor="start">点位用途与建议高度已落实；电流等级、回路、线径、接地、防护及湿区安装仍需现场电气设计。未修改三维模型与网站。</text><polyline points="118.81,920.00 262.88,920.00" fill="none" stroke="#596c5b" stroke-width="3" /><text x="118.81" y="910.00" font-size="13" fill="#737b70" text-anchor="start">1 m · 虚拟模型比例</text></g></svg>