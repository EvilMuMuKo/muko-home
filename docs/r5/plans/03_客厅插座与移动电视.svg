b77b35" stroke-width="2"/><line x1="652.2047244094488" y1="867.3228346456691" x2="706.2547244094487" y2="899.8228346456691" stroke="#b77b35" stroke-width="1"/><rect x="662.2047244094488" y="888.3228346456691" width="88.1" height="23" rx="4" fill="#fffdf7" stroke="#b77b35" stroke-width=".8"/><text x="667.20" y="904.32" font-size="13" fill="#b77b35" text-anchor="start">A01 · H2300</text><text x="1010.00" y="180.00" font-size="21" fill="#34443a" text-anchor="start">图例与点位约定</text><text x="1010.00" y="218.00" font-size="14" fill="#34443a" text-anchor="start">实心棕点：拟布置电源组</text><text x="1010.00" y="248.00" font-size="14" fill="#34443a" text-anchor="start">空心点：条件未定，暂缓施工</text><text x="1010.00" y="278.00" font-size="14" fill="#34443a" text-anchor="start">蓝点：独立弱电；紫点：固定接线</text><text x="1010.00" y="308.00" font-size="14" fill="#34443a" text-anchor="start">C04：家具排插，不重复算墙插</text><text x="1010.00" y="338.00" font-size="14" fill="#34443a" text-anchor="start">F01菱形：可选地插，非基础方案</text><text x="1010.00" y="368.00" font-size="14" fill="#34443a" text-anchor="start">虚线：尾线示意，须固定收线</text><text x="1010.00" y="398.00" font-size="14" fill="#34443a" text-anchor="start">H：完成地面至面板中心（mm）</text><text x="1010.00" y="428.00" font-size="14" fill="#34443a" text-anchor="start">编号详见下方完整点位表</text><text x="1010.00" y="500.00" font-size="21" fill="#34443a" text-anchor="start">重点位置</text><text x="1010.00" y="540.00" font-size="15" fill="#34443a" text-anchor="start">L01  下侧实墙，电视架右后方</text><text x="1010.00" y="573.00" font-size="15" fill="#34443a" text-anchor="start">L02  错台侧面，备用布局供电</text><text x="1010.00" y="606.00" font-size="15" fill="#34443a" text-anchor="start">L03  通顶浅柜右端，供落地灯</text><text x="1010.00" y="639.00" font-size="15" fill="#34443a" text-anchor="start">L04  浅柜开放格内可检修</text><text x="1010.00" y="672.00" font-size="15" fill="#34443a" text-anchor="start">L05  扫地机左侧可拔插</text><text x="1010.00" y="705.00" font-size="15" fill="#34443a" text-anchor="start">F01  停靠带地插仅作为条件选项</text><text x="1010.00" y="738.00" font-size="15" fill="#34443a" text-anchor="start">沙发充电用随身电池／短期设备</text><text x="1010.00" y="771.00" font-size="15" fill="#34443a" text-anchor="start">不从上侧墙拖线穿过沙发后通路</text><text x="55.00" y="1020.00" font-size="15" fill="#737b70" text-anchor="start">定位规则：以完成面和固定建筑参照复尺；编号圆点为使用侧位置，柜内墙源及可达面在JSON中分别记录。</text><text x="55.00" y="1055.00" font-size="15" fill="#737b70" text-anchor="start">橙色虚线为概念收线路径，不是电气敷设图。移动电视换位置前断电收线；仅标出的完整状态参与本轮计算。</text><text x="55.00" y="1090.00" font-size="15" fill="#737b70" text-anchor="start">点位用途与建议高度已落实；电流等级、回路、线径、接地、防护及湿区安装仍需现场电气设计。未修改三维模型与网站。</text><polyline points="116.77,920.00 250.63,920.00" fill="none" stroke="#596c5b" stroke-width="3" /><text x="116.77" y="910.00" font-size="13" fill="#737b70" text-anchor="start">1 m · 虚拟模型比例</text></g></svg>