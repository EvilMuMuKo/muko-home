t><polyline points="239.83,629.41 239.83,546.57 176.44,546.57 176.44,535.76" fill="none" stroke="#bd6b3c" stroke-width="2.5" stroke-dasharray="5 3"/><text x="587.03" y="442.12" font-size="20" fill="#737e6b" text-anchor="middle">影音室／书房</text><circle cx="651.8644067796611" cy="695.6779661016949" r="5.5" fill="#b55336" stroke="#b55336" stroke-width="2"/><line x1="651.8644067796611" y1="695.6779661016949" x2="702.3644067796611" y2="676.1779661016949" stroke="#b55336" stroke-width="1"/><rect x="661.8644067796611" y="664.6779661016949" width="81.0" height="23" rx="4" fill="#fffdf7" stroke="#b55336" stroke-width=".8"/><text x="666.86" y="680.68" font-size="13" fill="#b55336" text-anchor="start">C01 · H350</text><circle cx="905.4237288135594" cy="528.5593220338983" r="5.5" fill="#b55336" stroke="#b55336" stroke-width="2"/><line x1="905.4237288135594" y1="528.5593220338983" x2="854.9237288135594" y2="509.0593220338983" stroke="#b55336" stroke-width="1"/><rect x="814.4237288135594" y="497.5593220338983" width="81.0" height="23" rx="4" fill="#fffdf7" stroke="#b55336" stroke-width=".8"/><text x="819.42" y="513.56" font-size="13" fill="#b55336" text-anchor="start">C02 · H350</text><circle cx="239.83050847457628" cy="629.406779661017" r="5.5" fill="#b55336" stroke="#b55336" stroke-width="2"/><line x1="239.83050847457628" y1="629.406779661017" x2="290.3305084745763" y2="609.906779661017" stroke="#b55336" stroke-width="1"/><rect x="249.83050847457628" y="598.406779661017" width="81.0" height="23" rx="4" fill="#fffdf7" stroke="#b55336" stroke-width=".8"/><text x="254.83" y="614.41" font-size="13" fill="#b55336" text-anchor="start">C03 · H550</text><circle cx="176.4406779661017" cy="535.7627118644068" r="5.5" fill="#89744d" stroke="#89744d" stroke-width="2"/><line x1="176.4406779661017" y1="535.7627118644068" x2="226.9406779661017" y2="516.2627118644068" stroke="#89744d" stroke-width="1"/><rect x="186.4406779661017" y="504.7627118644068" width="81.0" height="23" rx="4" fill="#fffdf7" stroke="#89744d" stroke-width=".8"/><text x="191.44" y="520.76" font-size="13" fill="#89744d" text-anchor="start">C04 · H780</text><circle cx="306.10169491525426" cy="231.77966101694915" r="5.5" fill="#b55336" stroke="#b55336" stroke-width="2"/><line x1="306.10169491525426" y1="231.77966101694915" x2="360.15169491525427" y2="212.27966101694915" stroke="#b55336" stroke-width="1"/><rect x="316.10169491525426" y="200.77966101694915" width="88.1" height="23" rx="4" fill="#fffdf7" stroke="#b55336" stroke-width=".8"/><text x="321.10" y="216.78" font-size="13" fill="#b55336" text-anchor="start">C05 · H1050</text><circle cx="695.0847457627119" cy="231.77966101694915" r="5.5" fill="#b55336" stroke="#b55336" stroke-width="2"/><line x1="695.0847457627119" y1="231.77966101694915" x2="745.5847457627119" y2="212.27966101694915" stroke="#b55336" stroke-width="1"/><rect x="705.0847457627119" y="200.77966101694915" width="81.0" height="23" rx="4" fill="#fffdf7" stroke="#b55336" stroke-width=".8"/><text x="710.08" y="216.78" font-size="13" fill="#b55336" text-anchor="start">C06 · H650</text><circle cx="803.135593220339" cy="384.49152542372883" r="5.5" fill="#b55336" stroke="#b55336" stroke-width="2"/><line x1="803.135593220339" y1="384.49152542372883" x2="853.635593220339" y2="364.99152542372883" stroke="#b55336" stroke-width="1"/><rect x="813.135593220339" y="353.49152542372883" width="81.0" height="23" rx="4" fill="#fffdf7" stroke="#b55336" stroke-width=".8"/><text x="818.14" y="369.49" font-size="13" fill="#b55336" text-anchor="start">C07 · H350</text><circle cx="752.7118644067796" cy="231.77966101694915" r="5.5" fill="#faf7ef" stroke="#b77b35" stroke-width="2"/><line x1="752.7118644067796" y1="231.77966101694915" x2="806.7618644067795" y2="264.27966101694915" stroke="#b77b35" stroke-width="1"/><rect x="762.7118644067796" y="252.77966101694915" width="88.1" height="23" rx="4" fill="#fffdf7" stroke="#b77b35" stroke-width=".8"/><text x="767.71" y="268.78" font-size="13" fill="#b77b35" text-anchor="start">A03 · H2300</text><text x="1010.00" y="180.00" font-size="21" fill="#34443a" text-anchor="start">图例与点位约定</text><text x="1010.00" y="218.00" font-size="14" fill="#34443a" text-anchor="start">实心棕点：拟布置电源组</text><text x="1010.00" y="248.00" font-size="14" fill="#34443a" text-anchor="start">空心点：条件未定，暂缓施工</text><text x="1010.00" y="278.00" font-size="14" fill="#34443a" text-anchor="start">蓝点：独立弱电；紫点：固定接线</text><text x="1010.00" y="308.00" font-size="14" fill="#34443a" text-anchor="start">C04：家具排插，不重复算墙插</text><text x="1010.00" y="338.00" font-size="14" fill="#34443a" text-anchor="start">F01菱形：可选地插，非基础方案</text><text x="1010.00" y="368.00" font-size="14" fill="#34443a" text-anchor="start">虚线：尾线示意，须固定收线</text><text x="1010.00" y="398.00" font-size="14" fill="#34443a" text-anchor="start">H：完成地面至面板中心（mm）</text><text x="1010.00" y="428.00" font-size="14" fill="#34443a" text-anchor="start">编号详见下方完整点位表</text><text x="1010.00" y="500.00" font-size="21" fill="#34443a" text-anchor="start">重点位置</text><text x="1010.00" y="540.00" font-size="15" fill="#34443a" text-anchor="start">C01  底座右侧，避开后方46mm窄缝</text><text x="1010.00" y="573.00" font-size="15" fill="#34443a" text-anchor="start">C03  窗洞端部实墙，墙源+网口</text><text x="1010.00" y="606.00" font-size="15" fill="#34443a" text-anchor="start">C04  跨飘窗长桌后左，桌面排插</text><text x="1010.00" y="639.00" font-size="15" fill="#34443a" text-anchor="start">沿左侧线槽引入，不跨625mm间隙</text><text x="1010.00" y="672.00" font-size="15" fill="#34443a" text-anchor="start">C05  高于小沙发靠背，避免被挡</text><text x="1010.00" y="705.00" font-size="15" fill="#34443a" text-anchor="start">C06  原大沙发床右侧充电</text><text x="1010.00" y="738.00" font-size="15" fill="#34443a" text-anchor="start">C07  小冰箱邻格，保留可检修口</text><text x="1010.00" y="771.00" font-size="15" fill="#34443a" text-anchor="start">床尾入桌下400mm，桌下不放电源</text><text x="55.00" y="1020.00" font-size="15" fill="#737b70" text-anchor="start">定位规则：以完成面和固定建筑参照复尺；编号圆点为使用侧位置，柜内墙源及可达面在JSON中分别记录。</text><text x="55.00" y="1055.00" font-size="15" fill="#737b70" text-anchor="start">橙色虚线为概念收线路径，不是电气敷设图。移动电视换位置前断电收线；仅标出的完整状态参与本轮计算。</text><text x="55.00" y="1090.00" font-size="15" fill="#737b70" text-anchor="start">点位用途与建议高度已落实；电流等级、回路、线径、接地、防护及湿区安装仍需现场电气设计。未修改三维模型与网站。</text><polyline points="118.81,920.00 262.88,920.00" fill="none" stroke="#596c5b" stroke-width="3" /><text x="118.81" y="910.00" font-size="13" fill="#737b70" text-anchor="start">1 m · 虚拟模型比例</text></g></svg>