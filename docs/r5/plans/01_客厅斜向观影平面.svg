<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#537c68"/></marker></defs><rect width="100%" height="100%" fill="#faf7ef"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="48" font-size="29" fill="#304036" text-anchor="start">MuKo Home / 客厅斜向85英寸电视</text><text x="40" y="84" font-size="17" fill="#304036" text-anchor="start">A9 · 双人合并观影 · 移动电视与模块沙发配合转向，中央无固定茶几。</text><polygon points="94.00,184.00 664.00,184.00 664.00,778.00 118.00,778.00 118.00,670.00 94.00,670.00" fill="#f0e8da" stroke="#6f776a" stroke-width="10"/><polygon points="664.00,184.00 808.00,184.00 808.00,778.00 664.00,778.00" fill="#eeeee3" stroke="#7c8376" stroke-width="7"/><polyline points="664.00,235.00 664.00,721.00" fill="none" stroke="#f0e8da" stroke-width="12" /><polygon points="124.00,194.80 580.00,194.80 580.00,233.20 124.00,233.20" fill="#b39a79" stroke="#776e60" /><text x="352.00000000000006" y="221.2" font-size="14" fill="#304036" text-anchor="middle">原通顶浅柜保留</text><polygon points="230.80,725.20 374.80,725.20 374.80,767.20 230.80,767.20" fill="#d8d0bf" stroke="#99866e" fill-opacity=".35" stroke-dasharray="5 3"/><text x="302.80000000000007" y="763.6" font-size="11" fill="#304036" text-anchor="middle">悬空柜·下方收纳</text><polygon points="236.80,703.60 368.80,703.60 368.80,725.20 236.80,725.20" fill="#aeb29f" stroke="#776e60" /><polygon points="272.80,727.00 332.80,727.00 332.80,745.00 272.80,745.00" fill="#aeb29f" stroke="#776e60" /><polygon points="272.80,746.20 332.80,746.20 332.80,764.20 272.80,764.20" fill="#aeb29f" stroke="#776e60" /><text x="302.80000000000007" y="691.6" font-size="12" fill="#304036" text-anchor="middle">桌椅收起</text><polygon points="149.20,545.20 194.80,545.20 194.80,590.80 149.20,590.80" fill="#c7aa81" stroke="#776e60" /><text x="171.99999999999994" y="604.0" font-size="11" fill="#304036" text-anchor="middle">边几停靠</text><circle cx="609.9999999999999" cy="225.99999999999997" r="24.599999999999998" fill="#d9b76d" stroke="#816f45"/><text x="609.9999999999999" y="225.99999999999997" font-size="12" fill="#304036" text-anchor="middle">灯</text><polygon points="604.00,716.80 649.60,716.80 649.60,767.20 604.00,767.20" fill="#ddd5c5" stroke="#776e60" /><text x="626.8" y="745.6" font-size="10" fill="#304036" text-anchor="middle">扫地机</text><polygon points="700.00,214.00 772.00,214.00 772.00,298.00 700.00,298.00" fill="#c8d0c9" stroke="#776e60" /><text x="736.0" y="255.99999999999997" font-size="12" fill="#304036" text-anchor="middle">洗烘</text><polygon points="698.80,688.60 773.20,688.60 773.20,766.60 698.80,766.60" fill="#c5b296" stroke="#776e60" /><text x="736.0" y="731.2" font-size="12" fill="#304036" text-anchor="middle">家政柜</text><polyline points="790.00,328.00 790.00,652.00" fill="none" stroke="#afbcac" stroke-width="3" stroke-dasharray="4 5"/><polyline points="94.00,256.00 94.00,652.00" fill="none" stroke="#f0e8da" stroke-width="12" /><polygon points="232.00,233.20 653.20,233.20 653.20,348.40 232.00,348.40" fill="#dce6d9" stroke="none" fill-opacity=".8"/><polyline points="238.00,292.00 556.00,292.00 640.00,340.00 718.00,388.00" fill="none" stroke="#537c68" stroke-width="3" marker-end="url(#arrow)"/><text x="429.9999999999999" y="275.2" font-size="13" fill="#426d58" text-anchor="middle">沙发后方通路</text><polygon points="547.29,464.44 408.62,529.10 355.38,414.90 494.04,350.24" fill="#c3cec0" stroke="#5e7567" stroke-width="1.5"/><polygon points="500.61,374.98 370.10,435.84 361.48,417.35 491.99,356.49" fill="#a6b8a3" stroke="#776e60" /><text x="453.868255278748" y="445.10754969905634" font-size="12" fill="#304036" text-anchor="middle">单人模块1</text><polyline points="438.65,412.48 490.00,688.00" fill="none" stroke="#688ba1" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="438.6539978560828" cy="412.480469365737" r="3.5" fill="#416b83"/><polygon points="408.62,529.10 269.96,593.76 216.71,479.56 355.38,414.90" fill="#c3cec0" stroke="#5e7567" stroke-width="1.5"/><polygon points="361.95,439.64 231.44,500.50 222.82,482.01 353.33,421.15" fill="#a6b8a3" stroke="#776e60" /><text x="315.20316386214046" y="509.76814374538327" font-size="12" fill="#304036" text-anchor="middle">单人模块2</text><polyline points="299.99,477.14 490.00,688.00" fill="none" stroke="#688ba1" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="299.9889064394752" cy="477.14106341206394" r="3.5" fill="#416b83"/><polygon points="566.55,696.00 446.92,751.78 413.45,680.00 533.08,624.22" fill="#d1ddd6" stroke="#587665" stroke-width="1.5"/><polygon points="594.57,643.21 388.47,739.31 385.43,732.79 591.53,636.69" fill="#2d4035" stroke="#152d20" stroke-width="2"/><text x="519.9999999999999" y="754.0" font-size="13" fill="#304036" text-anchor="middle">85英寸 · 斜向约25°</text><text x="387.99999999999994" y="592.0" font-size="13" fill="#8a7662" text-anchor="middle">中央无固定茶几</text><text x="870" y="170" font-size="23" fill="#304036" text-anchor="start">本轮落图</text><text x="870" y="212" font-size="16" fill="#304036" text-anchor="start">85英寸移动电视作为主案。</text><text x="870" y="246" font-size="16" fill="#304036" text-anchor="start">电视与沙发同转约25°，配合视线。</text><text x="870" y="280" font-size="16" fill="#304036" text-anchor="start">沙发仍是两个可拆合单人模块。</text><text x="870" y="314" font-size="16" fill="#304036" text-anchor="start">尺寸2.55×1.05m，不缩小家具。</text><text x="870" y="348" font-size="16" fill="#304036" text-anchor="start">桌椅与悬空柜保留原收纳关系。</text><text x="870" y="382" font-size="16" fill="#304036" text-anchor="start">落地灯移至靠阳台的柜端角。</text><text x="870" y="456" font-size="21" fill="#304036" text-anchor="start">合并观影的尺寸预算</text><text x="870" y="498" font-size="15" fill="#304036" text-anchor="start">两人眼睛到屏幕中心约2.32–2.35m。</text><text x="870" y="531" font-size="15" fill="#304036" text-anchor="start">沙发后缘至柜前约975mm。</text><text x="870" y="564" font-size="15" fill="#304036" text-anchor="start">沙发右侧局部约883mm；主路走背后。</text><text x="870" y="597" font-size="15" fill="#304036" text-anchor="start">85机身1895×1087mm，4K。</text><text x="870" y="630" font-size="15" fill="#304036" text-anchor="start">架体占位1100×660mm（参考产品）。</text><text x="870" y="706" font-size="21" fill="#304036" text-anchor="start">验证边界</text><text x="870" y="746" font-size="15" fill="#747569" text-anchor="start">图示为最终静态位置预算。</text><text x="870" y="777" font-size="15" fill="#747569" text-anchor="start">中间搬移过程、携物与柜门组合待核。</text><text x="870" y="808" font-size="15" fill="#747569" text-anchor="start">支架承载、VESA、重心和线缆待核。</text><text x="870" y="839" font-size="15" fill="#747569" text-anchor="start">真实观影舒适度及现场尺寸尚未验收。</text><text x="40" y="870" font-size="14" fill="#6f756b" text-anchor="start">* 房屋及人物眼位沿用当前虚拟模型。活动区与通路为几何预算，不代表现场通过；不以电视屏幕投影代替底座检查。</text><text x="40" y="901" font-size="14" fill="#6f756b" text-anchor="start">本轮只修改客厅平面，影音室A8的85英寸移动电视方案保留。三维模型、网站与GitHub未修改。</text><text x="40" y="953" font-size="14" fill="#6f756b" text-anchor="start">方向沿用当前模型图面；家具转角相对原摆位约25°。柜体、墙、建筑外框均未移动。</text></g></svg>