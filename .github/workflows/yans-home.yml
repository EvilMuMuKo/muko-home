name: YAN’s Home draft
on:
  pull_request:
    paths: ['projects/yans-home/**', 'yans-home/**', '.github/workflows/yans-home.yml']
  push:
    branches: [main]
    paths: ['projects/yans-home/**', 'yans-home/**', '.github/workflows/yans-home.yml']
permissions:
  contents: read
jobs:
  test-yans-home:
    name: YAN tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: projects/yans-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/yans-home/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify committed Pages child directory
        run: |
          git diff --exit-code -- ../../yans-home public/transform.wasm
          test -z "$(git ls-files --others --exclude-standard -- ../../yans-home)"
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --fully-parallel --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: yans-home-test-results-${{ matrix.shard }}
          path: projects/yans-home/test-results
  verify-yans-home:
    runs-on: ubuntu-latest
    needs: test-yans-home
    if: always()
    steps:
      - name: Require all browser test shards
        env:
          SHARD_RESULT: ${{ needs.test-yans-home.result }}
        run: test "$SHARD_RESULT" = success
