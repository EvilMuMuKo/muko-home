name: Build and verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generated Pages files are committed
        run: |
          git diff --exit-code -- index.html assets materials preview.jpg transform.wasm public/transform.wasm favicon.svg favicon-32.png apple-touch-icon.png icon-192.png icon-512.png site.webmanifest
          test -z "$(git ls-files --others --exclude-standard -- assets materials)"
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --fully-parallel --shard=${{ matrix.shard }}/4
        env:
          CHROMIUM_PATH: ""
