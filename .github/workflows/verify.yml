name: Build and verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- index.html assets preview.jpg transform.wasm public/transform.wasm
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CHROMIUM_PATH: ""
