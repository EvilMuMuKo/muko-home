<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#344b40" />
    <title>MuKo Home</title>
    <meta
      name="description"
      content="MuKo Home · 温暖自然的双人住宅空间概念设计"
    />
    <meta property="og:title" content="MuKo Home" />
    <meta
      property="og:description"
      content="白天是家，夜晚是两个人的私人咖啡酒吧。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://evilmumuko.github.io/muko-home/" />
    <link rel="canonical" href="https://evilmumuko.github.io/muko-home/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script type="module" crossorigin src="./assets/index-CBrRqESd.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three.core-C7NbAuPQ.js">
    <link rel="modulepreload" crossorigin href="./assets/three.module-BL07-aDj.js">
    <link rel="modulepreload" crossorigin href="./assets/three.webgpu-lfPx0L2h.js">
    <link rel="modulepreload" crossorigin href="./assets/three.tsl-DPVo_C7m.js">
    <link rel="modulepreload" crossorigin href="./assets/quality-D5mSLu84.js">
    <link rel="stylesheet" crossorigin href="./assets/index-Bz91SKlQ.css">
  </head>
  <body>
    <main id="experience">
      <section class="viewer" id="viewer" aria-label="MuKo Home 空间设计">
        <canvas
          id="scene"
          aria-label="住宅三维空间，左摇杆行走，右摇杆转头"
          tabindex="0"
        ></canvas
        ><img id="fallback" alt="住宅空间概览" hidden />
        <div class="space-caption">
          <h1 id="view-title">全屋概览</h1>
          <span>概念方案</span><span id="view-number" hidden></span>
          <p id="view-copy" hidden></p>
        </div>
        <button
          id="panel-toggle"
          class="panel-toggle"
          type="button"
          aria-controls="control-panel"
          aria-expanded="false"
          aria-label="打开控制面板"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-7 2v4" />
          </svg>
        </button>
        <aside id="control-panel" aria-label="展示控制" hidden>
          <div class="panel-head">
            <span>展示控制</span
            ><button id="panel-close" type="button" aria-label="关闭控制面板">
              关闭
            </button>
          </div>
          <div class="panel-tabs" role="tablist" aria-label="控制类别">
            <button
              role="tab"
              id="tab-space"
              aria-controls="panel-space"
              aria-selected="true"
              data-panel="space"
            >
              空间</button
            ><button
              role="tab"
              id="tab-light"
              aria-controls="panel-light"
              aria-selected="false"
              tabindex="-1"
              data-panel="light"
            >
              日夜</button
            ><button
              role="tab"
              id="tab-action"
              aria-controls="panel-action"
              aria-selected="false"
              tabindex="-1"
              data-panel="action"
            >
              动作
            </button>
          </div>
          <div class="panel-body">
            <section
              id="panel-space"
              role="tabpanel"
              aria-labelledby="tab-space"
            >
              <h2>空间视角</h2>
              <div class="room-tabs" aria-label="选择空间"></div>
              <div
                id="detail-controls"
                class="detail-controls"
                aria-label="餐厨局部视角"
                hidden
              ></div>
              <div
                id="viewpoint-controls"
                class="detail-controls"
                aria-label="室内观察点"
              ></div>
              <div hidden id="internal-visibility">
                <button id="show-all" type="button">显示全屋</button
                ><button id="show-current" type="button">只看当前</button>
                <div id="room-visibility"></div>
              </div>
              <h2>视角</h2>
              <div class="tools">
                <button id="walk-start" type="button">自由漫游</button
                ><button id="interior-view" type="button">室内视角</button
                ><button id="overview-view" type="button">全屋概览</button
                ><button
                  id="projection"
                  type="button"
                  aria-label="切换俯视与透视"
                >
                  俯视</button
                ><button id="reset" type="button" aria-label="复位视角">
                  复位</button
                ><button id="fullscreen" type="button">全屏</button
                ><button
                  id="export"
                  type="button"
                  aria-label="保存当前空间画面"
                >
                  保存画面
                </button>
              </div>
            </section>
            <section
              id="panel-light"
              role="tabpanel"
              aria-labelledby="tab-light"
              hidden
            >
              <h2>空间光线</h2>
              <div id="lighting-presets" class="lighting-presets"></div>
              <button
                id="lighting"
                hidden
                type="button"
                aria-label="切换日间与夜间"
              >
                日间 / 晚间
              </button>
            </section>
            <section
              id="panel-action"
              role="tabpanel"
              aria-labelledby="tab-action"
              hidden
            >
              <h2>当前空间</h2>
              <button
                id="bed-state"
                type="button"
                aria-label="展开或收起沙发床"
              >
                展开客床
              </button>
              <div
                id="motion-controls"
                class="motion-controls"
                aria-label="当前空间家具状态"
              ></div>
            </section>
            <section
              id="panel-storage"
              role="tabpanel"
              aria-labelledby="tab-storage"
              hidden
            >
              <h2>生活收纳</h2>
              <p id="storage-summary" class="storage-summary"></p>
              <button id="storage-doors" type="button">展开 / 收起柜门</button>
              <p class="storage-note">常用物件顺手可取，低频备品妥帖收藏。</p>
              <div id="storage-list"></div>
            </section>
          </div>
        </aside>
        <div id="internal-controls" hidden><div id="theme-moments"></div></div>
        <div class="loading" id="loading" role="status">
          <img src="./preview.jpg" alt="" />
          <span id="loading-status">准备空间</span>
        </div>
        <div id="notice" role="status"></div>
        <div id="orientation-gate" role="status">
          <svg viewBox="0 0 80 60" aria-hidden="true">
            <rect x="18" y="8" width="44" height="28" rx="5" />
            <path d="M64 46a28 28 0 0 1-45-1m-2-9 2 9 9-2" />
          </svg>
          <h2>请横屏查看</h2>
          <p>旋转设备，展开空间方案</p>
        </div>
      </section>
    </main>
  </body>
</html>
